  </g><text x="827" y="312" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="72" font-weight="800" fill="#14110f">Sudu</text><text x="827" y="368" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="36" font-weight="normal" fill="#6b6360">Food, market and errands, to your block</text><text x="827" y="520" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="96" font-weight="800" fill="#14110f">Bring 2 friends.</text><text x="827" y="628" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="96" font-weight="800" fill="#c2400e">Get ₦1,000 back.</text><text x="827" y="704" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="40" font-weight="normal" fill="#6b6360">Every time, however many times you do it.</text><rect x="150" y="760" width="1354" height="112" rx="28" fill="#ffffff"/><text x="210" y="836" text-anchor="start" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="52" font-weight="700" fill="#14110f">2 friends</text><text x="1444" y="836" text-anchor="end" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="800" fill="#c2400e">₦1,000 back</text><rect x="150" y="888" width="1354" height="112" rx="28" fill="#ffffff"/><text x="210" y="964" text-anchor="start" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="52" font-weight="700" fill="#14110f">4 friends</text><text x="1444" y="964" text-anchor="end" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="800" fill="#c2400e">₦2,000 back</text><rect x="150" y="1016" width="1354" height="112" rx="28" fill="#ffffff"/><text x="210" y="1092" text-anchor="start" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="52" font-weight="700" fill="#14110f">6 friends</text><text x="1444" y="1092" text-anchor="end" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="800" fill="#c2400e">₦3,000 back</text><rect x="150" y="1144" width="1354" height="112" rx="28" fill="#ff5a1f"/><text x="210" y="1220" text-anchor="start" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="52" font-weight="700" fill="#ffffff">20 friends</text><text x="1444" y="1220" text-anchor="end" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="800" fill="#ffffff">₦10,000 back</text><text x="827" y="1368" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="42" font-weight="700" fill="#14110f">It does not stop there. There is no limit.</text><text x="827" y="1426" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="34" font-weight="normal" fill="#6b6360">They have to order and pay. It comes back on your own order.</text><rect x="567" y="1438" width="520" height="680" rx="48" fill="#ffffff"/><g transform="translate(637 1514)"><svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 45 45" shape-rendering="crispEdges"><path stroke="#14110f" d="M0 0.5h7m4 0h1m6 0h4m1 0h5m2 0h4m2 0h1m1 0h7M0 1.5h1m5 0h1m2 0h1m2 0h1m2 0h3m5 0h1m5 0h5m1 0h1m2 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h1m3 0h3m2 0h2m1 0h1m1 0h3m3 0h3m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h1m1 0h4m2 0h1m2 0h2m2 0h1m3 0h2m1 0h1m2 0h1m1 0h2m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h1m1 0h9m8 0h4m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m2 0h3m3 0h1m1 0h2m3 0h2m3 0h2m7 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m5 0h3m3 0h1m3 0h1m1 0h1m2 0h2m1 0h1m3 0h1M0 8.5h1m1 0h5m2 0h1m1 0h1m1 0h3m2 0h1m1 0h5m2 0h4m1 0h1m1 0h3m1 0h5M4 9.5h2m3 0h5m1 0h1m2 0h1m2 0h1m9 0h1m8 0h5M1 10.5h1m4 0h2m1 0h1m1 0h1m1 0h1m3 0h2m1 0h2m1 0h2m3 0h3m1 0h3m1 0h4m2 0h2M3 11.5h1m1 0h1m1 0h1m3 0h1m1 0h1m1 0h4m2 0h4m1 0h2m1 0h1m2 0h6m3 0h1M0 12.5h1m3 0h1m1 0h2m1 0h2m1 0h1m1