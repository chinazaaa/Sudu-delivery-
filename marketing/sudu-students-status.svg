<text x="540" y="436" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#14110f" text-anchor="middle">Sudu</text>
<text x="540" y="480" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#6b6360" text-anchor="middle">Food to PAU, any block</text>
<rect x="56" y="572" width="968" height="316" rx="40" fill="#ff5a1f"/>
<text x="540" y="644" font-family="DejaVu Sans" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">Order together.</text>
<text x="540" y="748" font-family="DejaVu Sans" font-size="84" font-weight="bold" fill="#ffffff" text-anchor="middle">₦1,000 each.</text>
<text x="540" y="800" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#ffe6da" text-anchor="middle">Delivery is ₦4,000 for up to four things.</text>
<text x="540" y="836" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#ffe6da" text-anchor="middle">Four of you on one order, and that is it split.</text>
<text x="540" y="956" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#14110f" text-anchor="middle">14 kitchens. 1,081 dishes.</text>
<text x="540" y="1000" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#6b6360" text-anchor="middle">Everybody adds their own. One delivery between you.</text>
<rect x="56" y="1064" width="968" height="372" rx="36" fill="#ffffff"/>
<text x="540" y="1116" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#14110f" text-anchor="middle">Or a box, already packed</text>
<text x="100" y="1184" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#14110f" text-anchor="start">All-nighter</text>
<text x="980" y="1184" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#ff5a1f" text-anchor="end">from ₦15,496</text>
<text x="100" y="1258" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#14110f" text-anchor="start">Just us two</text>
<text x="980" y="1258" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#ff5a1f" text-anchor="end">from ₦18,495</text>
<text x="100" y="1332" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#14110f" text-anchor="start">Movie night</text>
<text x="980" y="1332" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#ff5a1f" text-anchor="end">from ₦18,500</text>
<text x="100" y="1406" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#14110f" text-anchor="start">Games night</text>
<text x="980" y="1406" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#ff5a1f" text-anchor="end">from ₦32,900</text>
<text x="540" y="1492" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#6b6360" text-anchor="middle">Skincare too: 2,103 products, one drop a week.</text>
<text x="540" y="1576" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#14110f" text-anchor="middle">sudu.store</text>
<text x="540" y="1622" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#6b6360" text-anchor="middle">On the App Store · WhatsApp +234 903 217 5147</text>
